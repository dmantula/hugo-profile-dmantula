{{/* Credentials row in hero — certifications/badges with linkable images.
     Driven by params.hero.credentials (list of {name, image, url}). */}}
{{ with .Site.Params.hero.credentials }}
<div class="hero-credentials d-flex flex-wrap align-items-center pt-2">
    {{ range . }}
    <a href="{{ .url }}" target="_blank" rel="noopener" class="credential-badge me-3 mt-3" title="{{ .name }}" aria-label="{{ .name }}">
        <img src="{{ .image }}" alt="{{ .name }}">
    </a>
    {{ end }}
</div>
{{ end }}
